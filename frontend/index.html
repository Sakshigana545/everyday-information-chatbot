<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sora Chatbot</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top" id="menuToggle">☰</div>
  <ul id="historyList" class="history-list"></ul>
  <div class="sidebar-bottom">⚙️</div>
</aside>

<!-- ================= SYSTEM PANEL ================= -->
<div class="system-panel" id="systemPanel">
  <div class="system-section">
    <h4>Account</h4>
    <p id="viewProfile">View Profile</p>
    <p id="logoutOption">Logout</p>
  </div>

  <div class="system-section">
    <h4>Chat</h4>
    <p id="clearChat">Clear Chat</p>
    <p id="resetChat">Reset Chat</p>
  </div>

  <div class="system-section">
    <h4>Appearance</h4>
    <p id="toggleDark">Dark Mode</p>
  </div>

  <div class="system-section">
    <h4>System</h4>
    <p>About</p>
    <p>Help</p>
  </div>
</div>
  <!-- App -->
  <div class="app">

    <!-- Navbar -->
    <header class="navbar">
      <div class="left-side">
        <div class="logo">Sora</div>
      </div>

      <div class="right-side">
        <!-- ✅ Added username span -->
        <span id="username"></span>

        <i class="fa-regular fa-user user-icon"></i>

        <a href="login.html">
          <button class="btn-primary">Login</button>
        </a>

        <a href="signup.html">
          <button class="signup">Sign up</button>
        </a>
      </div>
    </header>

    <!-- Main -->
    <main class="main-container">
      <h1 class="title" id="chat-title">What can I help with?</h1>

      <!-- ✅ Messages Area -->
      <div class="messages" id="messages"></div>

      <!-- Input Box -->
      <div class="chat-box">
        <input
          type="text"
          id="user-input"
          class="chat-input"
          placeholder="Message Sora..." />
        <button id="send-btn" class="send-btn">➤</button>
      </div>
    </main>

  </div>

  <script src="script.js" defer></script>
</body>
</html>
